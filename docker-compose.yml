version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hr_admin
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: hr_verification
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: .                  # <--- Context is now the root HRPredictionAgent directory
      dockerfile: backend/Dockerfile # <--- Path to the Dockerfile from root
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hr_admin:securepassword@db:5432/hr_verification
      - GEMINI_API_KEY=${GEMINI_API_KEY:-""}
    depends_on:
      - db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  postgres_data: